<!doctype html>
<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><meta name="referrer" content="no-referrer"><title>Seguimiento | Gestión de Locadores</title>
<style>
:root{--navy:#17365d;--blue:#1967d2;--ink:#172033;--muted:#68758a;--line:#dfe5ee;--page:#f4f7fb;--green:#16855b;--amber:#a76500;--red:#b52b3a}*{box-sizing:border-box}body{margin:0;font-family:Inter,system-ui,-apple-system,"Segoe UI",sans-serif;color:var(--ink);background:var(--page)}button,input,select{font:inherit}button{cursor:pointer}.top{min-height:72px;padding:13px clamp(18px,4vw,60px);display:flex;align-items:center;justify-content:space-between;gap:16px;color:#fff;background:linear-gradient(115deg,#102a4c,var(--navy));box-shadow:0 8px 24px #102a4c33}.brand{display:flex;align-items:center;gap:12px}.mark{display:grid;place-items:center;width:42px;height:42px;border-radius:12px;background:#fff;color:var(--navy);font-weight:900}.brand b{display:block}.brand small{opacity:.72}.nav{display:flex;gap:8px;align-items:center}.nav a,.nav button{border:1px solid #ffffff4d;border-radius:10px;padding:9px 12px;color:#fff;background:#ffffff12;text-decoration:none;font-weight:700;font-size:.82rem}.nav .active{background:#fff;color:var(--navy)}main{width:min(1380px,calc(100% - 30px));margin:auto;padding:34px 0 60px}.head{display:flex;justify-content:space-between;gap:18px;align-items:end;margin-bottom:22px}.head h1{margin:0;color:var(--navy);font-size:clamp(1.7rem,3vw,2.35rem)}.head p{margin:7px 0 0;color:var(--muted)}.metric{padding:12px 17px;border:1px solid var(--line);border-radius:13px;background:#fff;text-align:center}.metric strong{display:block;color:var(--navy);font-size:1.35rem}.metric span{font-size:.75rem;color:var(--muted)}.search{display:grid;grid-template-columns:2fr 1fr 1fr auto;gap:10px;padding:18px;border:1px solid var(--line);border-radius:16px;background:#fff;box-shadow:0 8px 25px #17365d0d}.field label{display:block;margin:0 0 6px;color:#59677b;font-size:.69rem;font-weight:850;text-transform:uppercase}.field input,.field select{width:100%;height:42px;border:1px solid #cdd6e3;border-radius:9px;padding:8px 10px;background:#fff;color:var(--ink);outline:none}.field input:focus,.field select:focus{border-color:var(--blue);box-shadow:0 0 0 3px #1967d21c}.go{align-self:end;height:42px;border:0;border-radius:9px;padding:0 18px;color:#fff;background:var(--blue);font-weight:800}.summary{display:flex;gap:9px;align-items:center;justify-content:space-between;margin:20px 2px 10px;color:var(--muted);font-size:.86rem}.cards{display:grid;gap:12px}.oc-card{border:1px solid var(--line);border-radius:15px;background:#fff;overflow:hidden;box-shadow:0 7px 22px #17365d0a}.oc-head{display:grid;grid-template-columns:minmax(240px,1.5fr) repeat(4,minmax(100px,.55fr)) auto;gap:12px;align-items:center;padding:16px 18px}.person b{display:block;color:var(--navy);font-size:.98rem}.person span,.datum span{display:block;margin-top:4px;color:var(--muted);font-size:.74rem}.datum b{font-size:.82rem}.pill{display:inline-flex;align-items:center;padding:5px 8px;border-radius:999px;font-size:.68rem;font-weight:850;background:#eaf2ff;color:#1252a6}.toggle{width:36px;height:36px;border:1px solid var(--line);border-radius:9px;background:#fff;color:var(--navy);font-size:1.1rem}.history{display:none;border-top:1px solid var(--line);padding:8px 18px 18px;background:#fbfcfe}.oc-card.open .history{display:block}.timeline{position:relative;margin-left:9px;padding-left:25px}.timeline:before{content:"";position:absolute;left:5px;top:15px;bottom:14px;width:2px;background:#d9e3ef}.event{position:relative;padding:13px 0 14px}.event:before{content:"";position:absolute;left:-25px;top:18px;width:12px;height:12px;border:3px solid #fff;border-radius:50%;background:var(--blue);box-shadow:0 0 0 1px #a9bdd6}.event-top{display:flex;align-items:center;gap:8px;flex-wrap:wrap}.date{font-weight:850;color:var(--navy);font-size:.8rem}.state{padding:4px 8px;border-radius:999px;background:#edf3fa;color:#385879;font-size:.67rem;font-weight:850}.event h3{margin:8px 0 5px;font-size:.84rem}.event p{margin:4px 0;color:#536177;font-size:.78rem;line-height:1.48;white-space:pre-wrap}.obs{margin-top:8px!important;padding:10px 12px;border-left:3px solid #7ba6da;border-radius:5px;background:#f1f6fc;color:#25364d!important}.empty{padding:42px 20px;text-align:center;border:1px dashed #bac7d8;border-radius:15px;background:#ffffff99;color:var(--muted)}.loading{padding:35px;text-align:center;color:var(--muted)}[hidden]{display:none!important}
@media(max-width:900px){.search{grid-template-columns:1fr 1fr}.search .field:first-child{grid-column:1/-1}.go{grid-column:1/-1}.oc-head{grid-template-columns:1fr 1fr}.person{grid-column:1/-1}.oc-head .toggle{position:absolute;right:26px}.oc-card{position:relative}.nav span{display:none}}
@media(max-width:560px){main{width:min(100% - 20px,1380px);padding-top:22px}.brand small{display:none}.nav a,.nav button{padding:8px 9px}.head{align-items:flex-start;flex-direction:column}.search{grid-template-columns:1fr}.search .field:first-child,.go{grid-column:auto}.oc-head{grid-template-columns:1fr;padding-right:58px}.person{grid-column:auto}.datum{display:flex;justify-content:space-between;gap:12px;border-top:1px solid #eef2f6;padding-top:8px}.datum span{margin:0}.history{padding-inline:12px}.timeline{padding-left:22px}.event p{font-size:.76rem}}
</style></head><body>
<header class="top"><div class="brand"><div class="mark">OC</div><div><b>Gestión de Locadores</b><small>GCTIC · ESSALUD</small></div></div><nav class="nav"><a href="index.html"><span>Historial de </span>OC</a><a class="active" href="seguimiento.html">Seguimiento</a><button id="logout">Salir</button></nav></header>
<main><section class="head"><div><h1>Seguimiento de pagos</h1><p>Consulta cada atención realizada y recupera rápidamente los antecedentes de un locador.</p></div><div class="metric"><strong id="total">—</strong><span>movimientos encontrados</span></div></section>
<section class="search" aria-label="Filtros de seguimiento"><div class="field"><label for="q">Locador, RUC u OC</label><input id="q" placeholder="Ej. Medina Palomino, 10709083762 o 4505522339" autocomplete="off"></div><div class="field"><label for="area">Área</label><select id="area"><option value="">Todas</option></select></div><div class="field"><label for="estado">Estado del trámite</label><select id="estado"><option value="">Todos</option></select></div><button class="go" id="buscar">Buscar</button></section>
<div class="summary"><span id="summary">Cargando historial…</span><span id="sessionUser"></span></div><section id="cards" class="cards"></section><div id="empty" class="empty" hidden>No se encontraron revisiones con esos criterios.</div><div id="loading" class="loading">Cargando seguimiento…</div></main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script>
const {createClient}=supabase;const db=createClient('https://acckrmanpgycunpvmfrl.supabase.co','sb_publishable_2nDjJmqL9oNdWGcpm3MgnQ_KXg5WuBI',{auth:{persistSession:true,autoRefreshToken:true,detectSessionInUrl:true}});
const $=s=>document.querySelector(s),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]));
const fmt=d=>d?new Date(d+'T12:00:00').toLocaleDateString('es-PE'):'—';const money=n=>new Intl.NumberFormat('es-PE',{style:'currency',currency:'PEN'}).format(Number(n||0));
let rows=[];
async function boot(){const {data:{session}}=await db.auth.getSession();if(!session){location.href='index.html';return}$('#sessionUser').textContent=session.user.email||'';await load()}
async function load(){$('#loading').hidden=false;$('#empty').hidden=true;$('#cards').innerHTML='';const {data,error}=await db.from('v_seguimiento_historial').select('*').order('fecha_revision',{ascending:false}).order('movimiento_id',{ascending:false}).limit(1000);$('#loading').hidden=true;if(error){$('#summary').textContent='No se pudo cargar el historial.';$('#empty').textContent=error.message;$('#empty').hidden=false;return}rows=data||[];fillFilters();render()}
function fillFilters(){const a=[...new Set(rows.map(x=>x.subgerencia_snapshot||x.subgerencia).filter(Boolean))].sort();const e=[...new Set(rows.map(x=>x.estado_tramite).filter(Boolean))].sort();$('#area').innerHTML='<option value="">Todas</option>'+a.map(x=>'<option>'+esc(x)+'</option>').join('');$('#estado').innerHTML='<option value="">Todos</option>'+e.map(x=>'<option>'+esc(x)+'</option>').join('')}
function render(){const q=$('#q').value.trim().toLocaleLowerCase('es'),area=$('#area').value,estado=$('#estado').value;const f=rows.filter(x=>(!q||[x.apellidos_nombres,x.ruc,x.numero_oc].some(v=>String(v||'').toLocaleLowerCase('es').includes(q)))&&(!area||(x.subgerencia_snapshot||x.subgerencia)===area)&&(!estado||x.estado_tramite===estado));$('#total').textContent=f.length;$('#summary').textContent=f.length+' movimiento'+(f.length===1?'':'s')+' · '+new Set(f.map(x=>x.orden_compra_id)).size+' OC';$('#empty').hidden=!!f.length;
const groups=new Map();f.forEach(x=>{if(!groups.has(x.orden_compra_id))groups.set(x.orden_compra_id,[]);groups.get(x.orden_compra_id).push(x)});
$('#cards').innerHTML=[...groups.values()].map(g=>{const x=g[0],area=x.subgerencia_snapshot||x.subgerencia||'—';return '<article class="oc-card"><div class="oc-head"><div class="person"><b>'+esc(x.apellidos_nombres)+'</b><span>RUC '+esc(x.ruc)+'</span></div><div class="datum"><span>OC</span><b>'+esc(x.numero_oc)+'</b></div><div class="datum"><span>Área</span><b>'+esc(area)+'</b></div><div class="datum"><span>Monto</span><b>'+money(x.monto_total)+'</b></div><div class="datum"><span>Atenciones</span><b>'+g.length+'</b></div><span class="pill">'+esc(x.periodo||'')+'</span><button class="toggle" aria-label="Mostrar historial" aria-expanded="false">＋</button></div><div class="history"><div class="timeline">'+g.map(v=>'<div class="event"><div class="event-top"><span class="date">'+fmt(v.fecha_revision)+'</span>'+(v.estado_tramite?'<span class="state">'+esc(v.estado_tramite)+'</span>':'')+'</div>'+(v.asunto?'<h3>'+esc(v.asunto)+'</h3>':'')+(v.remitente?'<p><b>Remitente:</b> '+esc(v.remitente)+'</p>':'')+(v.observaciones?'<p class="obs"><b>Observaciones:</b> '+esc(v.observaciones)+'</p>':'')+'</div>').join('')+'</div></div></article>'}).join('')}
$('#cards').addEventListener('click',e=>{const b=e.target.closest('.toggle');if(!b)return;const c=b.closest('.oc-card');c.classList.toggle('open');const open=c.classList.contains('open');b.textContent=open?'−':'＋';b.setAttribute('aria-expanded',String(open))});
$('#buscar').onclick=render;$('#area').onchange=render;$('#estado').onchange=render;$('#q').addEventListener('keydown',e=>{if(e.key==='Enter')render()});$('#q').addEventListener('input',()=>{if(!$('#q').value)render()});$('#logout').onclick=async()=>{await db.auth.signOut();location.href='index.html'};boot();
</script></body></html>
